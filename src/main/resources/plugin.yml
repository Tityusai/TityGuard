name: TityGuard
version: 1.0.0
main: dev.tityguard.TityGuard
api-version: '1.21'
description: Standalone anti-cheat for Paper 1.21.x
commands:
  tg:
    description: TityGuard main command
    aliases: [tityguard]
    permission: tityguard.command
permissions:
  tityguard.command:
    default: op
  tityguard.alerts:
    default: op
  tityguard.admin:
    default: op
  tityguard.bypass:
    default: false
